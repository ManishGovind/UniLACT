unilarn_config_path: "/path/to/UniLACT/unilarn/configs/models/vq_size128_dim32_multi_modal.yaml"
dataset_config_path: "/path/to/UniLACT/unilarn/configs/data/rtx.yaml"
dataloader_config:
  bs_per_gpu: 64
  workers_per_gpu: 7
  prefetch_factor: 2
rgb_preprocessor_config: 
  model_vision_type: "mae"
  vision_aug_config: 
    do_random_resized_crop: false
    do_random_shift: true
training_config:
  num_epochs: 20
  num_warmup_epochs: 1
  print_steps: 100
  lr_max: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 1
  save_epochs: 1
  save_steps: 1000
  save_path: "/path/to/UniLACT/unilarn/outputs/unilarn_trained_on_rtx/"
  resume_ckpt_path: null
